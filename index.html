
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Shop Project Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    :root {
      /* Adjust to match the height of rows 1 and 2 */
      --header-height: 70px;
    }

    /* FIXED HEADER AREA */
    #headerViewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      overflow: hidden;
      z-index: 10;
      background: white;
    }

    #headerExcel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2200px;
      border: none;
      pointer-events: none;
    }

    /* SCROLLING PROJECT AREA */
    #viewport {
      position: fixed;
      top: var(--header-height);
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: white;
    }

    #excel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2200px;
      border: none;
      background: white;
      will-change: transform;
    }
  </style>
</head>

<body>

  <!-- FROZEN ROWS 1 AND 2 -->
  <div id="headerViewport">
    <iframe
      id="headerExcel"
      title="Frozen Excel Headers">
    </iframe>
  </div>

  <!-- SCROLLING WORKBOOK -->
  <div id="viewport">
    <iframe
      id="excel"
      title="Scrolling Project Dashboard">
    </iframe>
  </div>

  <script>
    const EXCEL_URL =
      "https://infinityarch.sharepoint.com/sites/PMs/_layouts/15/Doc.aspx?sourcedoc={3f791bc9-e80c-4c23-969f-63aa5ef29fc0}&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=True&wdInConfigurator=True";

    // ADJUSTABLE SETTINGS
    const SHEET_HEIGHT = 2200;

    // Height of rows 1 and 2 combined
    const HEADER_HEIGHT = 70;

    const SCROLL_SPEED = 10;

    const TOP_PAUSE = 5000;
    const BOTTOM_PAUSE = 5000;

    // Refresh every 60 seconds
    const REFRESH_INTERVAL = 60000;

    const frame = document.getElementById("excel");
    const headerFrame =
      document.getElementById("headerExcel");

    const viewport =
      document.getElementById("viewport");

    document.documentElement.style.setProperty(
      "--header-height",
      HEADER_HEIGHT + "px"
    );

    frame.style.height = SHEET_HEIGHT + "px";
    headerFrame.style.height = SHEET_HEIGHT + "px";

    let offset = 0;
    let direction = 1;
    let pauseUntil = Date.now() + TOP_PAUSE;
    let previous = performance.now();

    function animate(now) {
      const elapsed = Math.min(
        (now - previous) / 1000,
        0.1
      );

      previous = now;

      const maxOffset = Math.max(
        0,
        SHEET_HEIGHT -
        HEADER_HEIGHT -
        viewport.clientHeight
      );

      if (Date.now() >= pauseUntil) {
        offset += direction * SCROLL_SPEED * elapsed;

        if (offset >= maxOffset) {
          offset = maxOffset;
          direction = -1;
          pauseUntil = Date.now() + BOTTOM_PAUSE;
        } else if (offset <= 0) {
          offset = 0;
          direction = 1;
          pauseUntil = Date.now() + TOP_PAUSE;
        }
      }

      // Start scrolling view below frozen rows.
      frame.style.transform =
        `translateY(-${HEADER_HEIGHT + offset}px)`;

      requestAnimationFrame(animate);
    }

    function refreshDashboard() {
      const url = new URL(EXCEL_URL);
      url.searchParams.set(
        "_refresh",
        Date.now().toString()
      );

      const refreshedUrl = url.toString();

      headerFrame.src = refreshedUrl;
      frame.src = refreshedUrl;
    }

    refreshDashboard();

    requestAnimationFrame(animate);

    setInterval(
      refreshDashboard,
      REFRESH_INTERVAL
    );
  </script>
</body>
</html>
