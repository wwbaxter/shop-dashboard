<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shop Dashboard</title>
	<styles>
		body {
			margin: 0;
			background: #111827;
			overflow: hidden;
		}
		img {
			width: 100vw;
			height: 100vh;
			object-fit: contain;
		}
	</style>
</head>
<body>
	<img id="dashboard" src="dashboard.png" alt="Production Dashboard">
	<script>
		setInterval(() => {
			const image = new Image();
			image.onload = () => {
				document.getElementById("dashboard").src = image.src;
			};
			image.src = "dashboard.png?t=" + Date.now();
		}, 60000);
	</script>
</body>
</html>
