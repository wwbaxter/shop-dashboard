
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop Project Dashboard</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #ffffff;
    }

    #dashboard {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }
  </style>
</head>

<body>

  <img id="dashboard" src="dashboard.png" alt="Shop Dashboard">

  <script>
    // Refresh dashboard image every 60 seconds
    setInterval(() => {
      const dashboard = document.getElementById("dashboard");
      dashboard.src = "dashboard.png?t=" + Date.now();
    }, 60000);
  </script>

</body>
</html>
